# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: evim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evim
    ports:
      # 5433 on your computer, so it never clashes with another PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - evim-db-data:/var/lib/postgresql/data

volumes:
  evim-db-data:
